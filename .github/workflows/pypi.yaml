name: PyPI

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]

# Permissions are required to create a release and publish to PyPI
permissions:
    id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        id: publishpypi
        uses: pypa/gh-action-pypi-publish@v1.14.2
      - name: Create Github release
        if: steps.publishpypi.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.CLI_GH_TOKEN }}
        run: |
          # Read the version from the same file setup.py reads; invoking setup.py
          # directly is deprecated by setuptools.
          VERSION=$(python -c "m = {}; exec(open('src/dlomix/_metadata.py').read(), m); print(m['__version__'])")
          # the "## [VERSION] - date" section of CHANGELOG.md, without its heading;
          # fails if the CHANGELOG has no section for this version
          python - "$VERSION" > release_notes.md <<'EOF'
          import re, sys
          text = open("CHANGELOG.md").read()
          match = re.search(rf"^## \[{re.escape(sys.argv[1])}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          if not match:
              sys.exit(f"CHANGELOG.md has no section for {sys.argv[1]}")
          print(match.group(1).strip())
          EOF
          gh release create v$VERSION --title $VERSION --notes-file release_notes.md
